apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cheiron
resources:
  - namespace.yaml
  - postgres.yaml
  - api.yaml
  - web.yaml
  - ingress.yaml
# Images are set per deploy (git commit tag) by infra/scripts/deploy.sh.
images:
  - name: cheiron-api
    newTag: latest
  - name: cheiron-web
    newTag: latest
