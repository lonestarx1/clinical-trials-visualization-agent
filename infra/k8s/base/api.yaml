apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 8000
---
# One replica on purpose: ClinicalTrials.gov allows ~10 requests per 10 s from our IP and each
# replica has its own limiter, so more replicas would share (not add) that budget. Background
# jobs already work across replicas (SKIP LOCKED queue + heartbeats) if this changes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 # the new pod must be ready before the old one stops
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      imagePullSecrets:
        - name: ecr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      initContainers:
        - name: wait-for-postgres # migrations run at start, so the database must be up first
          image: postgres:17-alpine
          command: ["sh", "-c", "until pg_isready -h postgres -U ctviz -d ctviz; do sleep 2; done"]
          securityContext:
            allowPrivilegeEscalation: false
      containers:
        - name: api
          image: cheiron-api
          ports:
            - containerPort: 8000
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cheiron-db
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgresql+asyncpg://ctviz:$(POSTGRES_PASSWORD)@postgres:5432/ctviz
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cheiron-openai
                  key: OPENAI_API_KEY
            - name: CORS_ORIGINS
              value: '["https://trials.cheiron.engineeradriel.com"]'
            - name: ENABLE_DEBUG_ENDPOINTS
              value: "false"
            - name: FORWARDED_ALLOW_IPS # trust X-Forwarded-For from the ingress (pod is cluster-internal)
              value: "*"
            # Keep the registry mirror loaded and current, ready for fast mode (design Q22). The
            # sync runs in this pod under the shared ClinicalTrials.gov limiter, at half its budget.
            - name: MIRROR_SYNC_ENABLED
              value: "true"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 1536Mi # also sets its swap share under LimitedSwap (~3 GB of 8)
            limits:
              memory: 2560Mi # RAM; the largest question (~2 GB peak) can spill into swap
          securityContext:
            allowPrivilegeEscalation: false
