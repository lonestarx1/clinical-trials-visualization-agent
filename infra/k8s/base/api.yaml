apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 8000
---
# One replica on purpose: ClinicalTrials.gov allows ~40 requests/min from our IP and each
# replica has its own limiter, so more replicas would share (not add) that budget. Background
# jobs already work across replicas (SKIP LOCKED queue + heartbeats) if this changes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 # the new pod must be ready before the old one stops
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      imagePullSecrets:
        - name: ecr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          image: cheiron-api
          ports:
            - containerPort: 8000
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cheiron-db
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgresql+asyncpg://ctviz:$(POSTGRES_PASSWORD)@postgres:5432/ctviz
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cheiron-openai
                  key: OPENAI_API_KEY
            - name: CORS_ORIGINS
              value: '["https://trials.cheiron.engineeradriel.com"]'
            - name: ENABLE_DEBUG_ENDPOINTS
              value: "false"
            - name: FORWARDED_ALLOW_IPS # trust X-Forwarded-For from the ingress (pod is cluster-internal)
              value: "*"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 4Gi # the largest question peaks around 2 GB
          securityContext:
            allowPrivilegeEscalation: false
