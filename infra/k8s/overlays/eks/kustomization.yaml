# Not deployed: how the same base runs on EKS. The AWS Load Balancer Controller turns the
# Ingress into an ALB with an ACM certificate (instead of Traefik + cert-manager), and
# Postgres gets an EBS gp3 volume through the EBS CSI driver. (A managed RDS instance would
# replace the StatefulSet in production.)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: Ingress
      name: cheiron
    patch: |-
      - op: add
        path: /spec/ingressClassName
        value: alb
      - op: remove
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
      - op: add
        path: /metadata/annotations/alb.ingress.kubernetes.io~1scheme
        value: internet-facing
      - op: add
        path: /metadata/annotations/alb.ingress.kubernetes.io~1target-type
        value: ip
      - op: add
        path: /metadata/annotations/alb.ingress.kubernetes.io~1listen-ports
        value: '[{"HTTP": 80}, {"HTTPS": 443}]'
      - op: add
        path: /metadata/annotations/alb.ingress.kubernetes.io~1ssl-redirect
        value: "443"
  - target:
      kind: StatefulSet
      name: postgres
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: gp3
