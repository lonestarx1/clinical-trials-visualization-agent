# Local stack: `make up` (or `docker compose up --build`), then http://localhost:3000.
# Only OPENAI_API_KEY is required in .env.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ctviz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ctviz}
      POSTGRES_DB: ctviz
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctviz -d ctviz"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file:
      - path: .env
        required: true
    environment:
      DATABASE_URL: postgresql+asyncpg://ctviz:${POSTGRES_PASSWORD:-ctviz}@postgres:5432/ctviz
      SYNC_MAX_SECONDS: ${SYNC_MAX_SECONDS:-60}
      # Fast mode (design Q22): the mirror's first load takes about 25 minutes. Off by default.
      MIRROR_SYNC_ENABLED: ${MIRROR_SYNC_ENABLED:-false}
      FAST_MODE_ENABLED: ${FAST_MODE_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  web:
    build: ./frontend
    environment:
      API_BASE_URL: http://api:8000  # runtime setting; the browser only talks to web
      PUBLIC_API_URL: http://localhost:8000  # the API address shown on /docs
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
